name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high --omit=dev

  db:
    name: Database (migrations, RLS, seed) on Supabase local and embedded PostgreSQL
    runs-on: ubuntu-latest
    env:
      # config.toml reads the send_sms hook secret from the environment; a dummy value keeps
      # `supabase start` happy here. Real secrets are repository secrets, never in the repo.
      SEND_SMS_HOOK_SECRETS: v1,whsec_Y2ktZHVtbXktc2VuZC1zbXMtaG9vay1zZWNyZXQ=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Supabase CLI comes from devDependencies (npm package "supabase"), so CI and every
      # developer machine run the same pinned version.
      - run: npm ci --no-audit --no-fund
      - name: Start Supabase local (applies supabase/migrations and seed.sql on the real stack)
        run: npx supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,supavisor,postgres-meta
      - name: DB tests against Supabase local (real auth schema, shim skipped)
        run: npm run db:test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: DB tests against embedded PostgreSQL (shim applied)
        run: npm run db:test
      - run: npm run typecheck:db
      - name: Generated database types match the migrations
        run: |
          npm run db:types
          git diff --exit-code -- src/services/api/database.types.ts
      - name: Stop Supabase local
        if: always()
        run: npx supabase stop --no-backup

  e2e-smoke:
    name: E2E smoke (Maestro, Android emulator)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Detect flows
        id: has_e2e
        run: |
          if ls e2e/*.yaml >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Skipped (no e2e flows yet)
        if: steps.has_e2e.outputs.present != 'true'
        run: echo "E2E skipped until flows exist in e2e/"
      - name: E2E placeholder
        if: steps.has_e2e.outputs.present == 'true'
        run: echo "E2E runner is configured in M3 (needs an EAS development build artifact and an emulator)."
